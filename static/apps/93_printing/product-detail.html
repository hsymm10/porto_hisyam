    <style>
        .detail-hero {
            min-height: 80vh !important; /* Slightly shorter than home but same style */
        }
        .product-info-section {
            padding: 60px 0;
            background: #f4f7fa;
        }
        .sub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .sub-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .sub-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .card-img-wrapper {
            width: 100%;
            height: 200px;
            background: #eee;
            position: relative;
            overflow: hidden;
        }
        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card-content h4 {
            font-size: 1.2rem;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }
        .card-content p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .price-tag {
            font-weight: 800;
            color: var(--primary-cyan);
            font-size: 1.1rem;
            margin-top: auto;
            border-top: 1px solid #f0f0f0;
            padding-top: 15px;
        }
        .btn-buy {
            margin-top: 15px;
            width: 100%;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.9rem;
        }

        body.menu-open {
            overflow: hidden !important;
        }
    </style>
