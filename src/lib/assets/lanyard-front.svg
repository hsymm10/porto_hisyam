<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" width="640" height="900">
	<rect width="640" height="900" fill="#ffffff" />
	<!-- Subtle graph grid -->
	<defs>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0d0d0d" stroke-opacity="0.07" stroke-width="2" />
		</pattern>
	</defs>
	<rect width="640" height="900" fill="url(#grid)" />

	<!-- Top slot clearance & violet header band -->
	<rect x="0" y="96" width="640" height="110" fill="#7542ff" />
	<line x1="0" y1="96" x2="640" y2="96" stroke="#0d0d0d" stroke-width="8" />
	<line x1="0" y1="206" x2="640" y2="206" stroke="#0d0d0d" stroke-width="8" />

	<text x="44" y="164" fill="#ffffff" font-family="monospace" font-size="34" font-weight="900" letter-spacing="3">
		&lt;/&gt; PORTO.DEV
	</text>
	<rect x="450" y="128" width="146" height="46" fill="#aee82a" stroke="#0d0d0d" stroke-width="6" />
	<text x="523" y="160" text-anchor="middle" fill="#0d0d0d" font-family="monospace" font-size="22" font-weight="900">
		2026
	</text>

	<!-- Avatar / Geometric Emblem Box with hard shadow -->
	<rect x="60" y="266" width="528" height="270" fill="#0d0d0d" />
	<rect x="48" y="254" width="528" height="270" fill="#ff6e9f" stroke="#0d0d0d" stroke-width="8" />
	<!-- Geometric stylized developer badge art -->
	<rect x="196" y="294" width="232" height="190" fill="#ffffff" stroke="#0d0d0d" stroke-width="7" />
	<circle cx="312" cy="364" r="42" fill="#aee82a" stroke="#0d0d0d" stroke-width="7" />
	<path d="M 244 484 C 244 434 380 434 380 484 Z" fill="#7542ff" stroke="#0d0d0d" stroke-width="7" />
	<rect x="76" y="282" width="84" height="36" fill="#aee82a" stroke="#0d0d0d" stroke-width="5" />
	<text x="118" y="307" text-anchor="middle" fill="#0d0d0d" font-family="monospace" font-size="18" font-weight="900">
		DEV
	</text>

	<!-- Role & Title -->
	<text x="48" y="608" fill="#0d0d0d" font-family="sans-serif" font-size="48" font-weight="900" letter-spacing="-1">
		HISYAM DEV
	</text>
	<text x="48" y="654" fill="#3f3f46" font-family="monospace" font-size="24" font-weight="700">
		SOFTWARE DEVELOPER
	</text>

	<!-- Divider -->
	<line x1="48" y1="688" x2="592" y2="688" stroke="#0d0d0d" stroke-width="6" />

	<!-- Tech Stack Pills -->
	<rect x="48" y="718" width="166" height="48" fill="#aee82a" stroke="#0d0d0d" stroke-width="6" />
	<text x="131" y="750" text-anchor="middle" fill="#0d0d0d" font-family="monospace" font-size="20" font-weight="800">
		SVELTEKIT
	</text>

	<rect x="230" y="718" width="180" height="48" fill="#ffffff" stroke="#0d0d0d" stroke-width="6" />
	<text x="320" y="750" text-anchor="middle" fill="#0d0d0d" font-family="monospace" font-size="20" font-weight="800">
		TYPESCRIPT
	</text>

	<rect x="426" y="718" width="166" height="48" fill="#7542ff" stroke="#0d0d0d" stroke-width="6" />
	<text x="509" y="750" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="20" font-weight="800">
		THREE.JS
	</text>

	<!-- Footer bar -->
	<rect x="0" y="814" width="640" height="86" fill="#0d0d0d" />
	<text x="48" y="868" fill="#aee82a" font-family="monospace" font-size="22" font-weight="800" letter-spacing="2">
		ID // NEO-BRUTAL-01
	</text>
	<circle cx="566" cy="858" r="14" fill="#ff6e9f" />
</svg>

